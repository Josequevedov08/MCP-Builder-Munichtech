services:
  - type: web
    name: mcp-builder-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SERVE_SITE
        value: "false"
      - key: ALLOWED_ORIGINS
        value: https://mcpbuilder.quevedojose.com,https://josequevedov08.github.io
      - key: FEATHERLESS_MODEL
        value: zai-org/GLM-5.2
      - key: FEATHERLESS_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY_2
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: SUPPORT_TO
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: Xb7hH8MSUJpSbSDYk0k2
